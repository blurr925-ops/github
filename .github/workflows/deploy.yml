name: Deploy Tennis Toolkit to GitHub Pages

on:
  push:
    branches: ['claude/find-tennis-toolkit-uXmK3', 'main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tennis-toolkit/package-lock.json
      - run: cd tennis-toolkit && npm ci
      - run: cd tennis-toolkit && npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tennis-toolkit/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
